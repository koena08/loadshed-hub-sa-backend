# Activate with SPRING_PROFILES_ACTIVE=prod
# All secrets below MUST be supplied as real environment variables in production;
# there are no safe hardcoded fallbacks for the sensitive ones.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.seed-data=false

# Fail fast if these aren't overridden by real secrets in the environment.
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

logging.level.com.jumpstart.loadshedhub=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.root=WARN

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
