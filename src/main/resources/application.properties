
spring.application.name=loadshed-hub
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/loadshed_hub
spring.datasource.username=root
spring.datasource.password=sandile
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


app.jwt.secret=YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm1234567890
app.jwt.expiration-ms=86400000


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs


logging.level.com.jumpstart.loadshedhub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE