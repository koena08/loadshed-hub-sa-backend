spring.application.name=loadshed-hub
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loadshed_hub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sandile}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# IMPORTANT: override app.jwt.secret via the JWT_SECRET env var in every real deployment.
# This default is only safe for local development.
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.seed-data=${SEED_DATA:true}

# Comma-separated list of origins allowed to call this API (browser CORS).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Base URL of the deployed frontend, used to build password-reset links.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Outgoing email for password resets. Disabled by default: the reset link is logged instead
# of emailed, so the flow works locally without SMTP credentials. Set app.mail.enabled=true
# and the spring.mail.* properties (or their env vars) in production.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:ndlovusandile043@gmail.com}
spring.mail.password=${SMTP_PASSWORD:adjz gfus wtej akox}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

logging.level.com.jumpstart.loadshedhub=${LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
